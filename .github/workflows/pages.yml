name: pages
# apps/web-minibim 을 GitHub Pages 로 자동 배포 — 푸시할 때마다 사이트 갱신
on:
  push:
    branches: [feat/planshot-flow, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-minibim
      - id: deployment
        uses: actions/deploy-pages@v4
